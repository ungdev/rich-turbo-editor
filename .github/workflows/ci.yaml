name: CI
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint:
    runs-on: sia-static-runners
    strategy:
      matrix:
        node-version: [22]
        pnpm-version: [11]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
        if: "!contains(github.event.commits[0].message, '[no-lint]')"
      - name: Install NodeJS
        if: "!contains(github.event.commits[0].message, '[no-lint]')"
        uses: pnpm/setup@v3
        with:
          runtime: node@${{ matrix.node-version }}
          require-lockfile: true
          version: ^${{ matrix.pnpm-version }}
      - run: pnpm lint
        if: "!contains(github.event.commits[0].message, '[no-lint]')"

  build:
    runs-on: sia-static-runners
    needs: lint
    strategy:
      matrix:
        node-version: [22]
        pnpm-version: [11]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install NodeJS
        uses: pnpm/setup@v3
        with:
          runtime: node@${{ matrix.node-version }}
          require-lockfile: true
          version: ^${{ matrix.pnpm-version }}
      - run: pnpm build

  docs:
    runs-on: sia-static-runners
    needs: build
    strategy:
      matrix:
        node-version: [22]
        pnpm-version: [11]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ matrix.pnpm-version }}
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          package-manager-cache: false
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      - name: Use Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: pnpm build:docs:configure
      - run: pnpm build:docs

  test:
    runs-on: sia-static-runners
    needs: docs
    strategy:
      matrix:
        node-version: [22]
        pnpm-version: [11]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install NodeJS
        uses: pnpm/setup@v3
        with:
          runtime: node@${{ matrix.node-version }}
          require-lockfile: true
          version: ^${{ matrix.pnpm-version }}
      - run: pnpm test:cov
      - uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
