name: CI
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint:
    if: "!contains(github.event.commits[0].message, '[no-lint]')"
    runs-on: self-hosted
    strategy:
      matrix:
        node-version: [22]
        pnpm-version: [10]
    steps:
      - uses: actions/checkout@v5
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ matrix.pnpm-version }}
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  build:
    runs-on: self-hosted
    needs: lint
    strategy:
      matrix:
        node-version: [22]
        pnpm-version: [10]
    steps:
      - uses: actions/checkout@v5
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ matrix.pnpm-version }}
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  docs:
    runs-on: self-hosted
    needs: build
    strategy:
      matrix:
        node-version: [22]
        pnpm-version: [10]
    steps:
      - uses: actions/checkout@v5
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ matrix.pnpm-version }}
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      - name: Use Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: pnpm build:docs:configure
      - run: pnpm build:docs

  test:
    runs-on: self-hosted
    needs: docs
    strategy:
      matrix:
        node-version: [22]
        pnpm-version: [10]
    steps:
      - uses: actions/checkout@v5
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ matrix.pnpm-version }}
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:cov
      - uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
